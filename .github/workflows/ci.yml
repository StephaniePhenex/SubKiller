name: SubKiller CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Dependency Security Scan
      # Fails the check on any high or critical advisory.
      run: npm audit --audit-level=high

    - name: Run Linters & Design Token Checks
      run: |
        npm run lint
        npx @google/design.md lint DESIGN.md

    - name: Run Unit Tests
      run: npm test