name: SubKiller CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege. setup-node's npm cache does not use GITHUB_TOKEN: cache
# save/restore is authorized by the runner's cache token ("Cache mode: write"
# in the "Set up job" log), so `actions: write` is not needed.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Dependency Security Scan
      # Fails the check on any high or critical advisory.
      run: npm audit --audit-level=high

    - name: Run Linters & Design Token Checks
      run: |
        npm run lint
        npx @google/design.md lint DESIGN.md

    - name: Type Check
      # Generates Next's route types, then checks the app and the Cypress project.
      run: npm run typecheck

    - name: Run Unit Tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Run E2E Tests (Cypress, headless)
      # Kept in this job so the required build-and-test check covers it.
      # test:e2e starts `next dev` with SUBKILLER_E2E_AUTH=1 (the Cypress auth
      # harness, which production builds ignore), waits for it to answer,
      # runs `cypress run`, then stops the server. A failing spec fails this step.
      # The Supabase values are local placeholders, not credentials: the specs
      # never reach Supabase, but the browser client needs them to load.
      env:
        NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      run: npm run test:e2e

  db-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Start Local Supabase
      # Applies supabase/migrations to a throwaway local database. Auth and
      # Storage stay on because the tests use auth.users and storage.buckets.
      run: npx supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

    - name: Run Database Tests (pgTAP)
      run: npm run test:db
