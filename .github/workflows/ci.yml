name: SubKiller CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege. setup-node's npm cache does not use GITHUB_TOKEN: cache
# save/restore is authorized by the runner's cache token ("Cache mode: write"
# in the "Set up job" log), so `actions: write` is not needed.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Dependency Security Scan
      # Fails the check on any high or critical advisory.
      run: npm audit --audit-level=high

    - name: Run Linters & Design Token Checks
      run: |
        npm run lint
        npx @google/design.md lint DESIGN.md

    - name: Run Unit Tests
      run: npm test

    - name: Build
      run: npm run build

  db-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Start Local Supabase
      # Applies supabase/migrations to a throwaway local database. Auth and
      # Storage stay on because the tests use auth.users and storage.buckets.
      run: npx supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

    - name: Run Database Tests (pgTAP)
      run: npm run test:db
