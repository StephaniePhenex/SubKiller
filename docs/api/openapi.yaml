openapi: 3.0.3
info:
  title: SubKiller API
  version: 1.0.0
  description: |
    The Review page server actions. `previewVerdict` and `scoreSubscription`
    are Next.js server actions. The browser posts them to `/review` with a
    Next-Action id. They are not separate public URLs, and a client cannot
    call them as REST.
paths:
  /review:
    post:
      operationId: reviewServerActions
      summary: Review server actions
      description: |
        Not a public REST endpoint. Next.js invokes one of two server actions
        from the Review page. The scorer is the deterministic rules engine in
        `src/lib/ai/provider.ts` (`mockVerdictProvider`), so a successful
        preview has `isMock: true`.
        `previewVerdict` scores the draft and stores nothing.
        `scoreSubscription` reads the stored row as the signed-in user and
        writes `ai_score` and `verdict` once through the server secret key.
        The browser sends only the row id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PreviewVerdictInput"
                - $ref: "#/components/schemas/ScoreSubscriptionInput"
      responses:
        "200":
          description: The action result, inside the Next.js server-action protocol.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PreviewResult"
                  - $ref: "#/components/schemas/ScoreResult"
components:
  schemas:
    Frequency:
      type: string
      enum: [weekly, monthly, yearly]
    ScoreFailure:
      type: string
      enum: [not-authenticated, invalid-input, not-found, invalid-ai-output, failed]
    PreviewVerdictInput:
      type: object
      additionalProperties: false
      required: [name, cost, frequency, feeling]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        cost:
          type: number
          minimum: 0
          exclusiveMinimum: true
        frequency:
          $ref: "#/components/schemas/Frequency"
        feeling:
          type: string
          maxLength: 1000
    ScoreSubscriptionInput:
      type: object
      additionalProperties: false
      required: [id]
      description: The argument to `scoreSubscription`. Next.js passes the row id as the action argument.
      properties:
        id:
          type: string
          format: uuid
    AiVerdict:
      type: object
      additionalProperties: false
      required: [aiScore, verdict]
      properties:
        aiScore:
          type: integer
          minimum: 0
          maximum: 100
        verdict:
          type: string
          minLength: 1
          maxLength: 500
    PreviewResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ok, verdict, isMock]
          properties:
            ok:
              type: boolean
              enum: [true]
            verdict:
              $ref: "#/components/schemas/AiVerdict"
            isMock:
              type: boolean
              description: True while the deterministic rules engine is the configured provider.
        - type: object
          additionalProperties: false
          required: [ok, reason]
          properties:
            ok:
              type: boolean
              enum: [false]
            reason:
              $ref: "#/components/schemas/ScoreFailure"
    Subscription:
      type: object
      additionalProperties: false
      required: [id, userId, name, cost, frequency, feeling, aiScore, verdict, createdAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        cost:
          type: number
        frequency:
          $ref: "#/components/schemas/Frequency"
        feeling:
          type: string
        aiScore:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        verdict:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ScoreResult:
      oneOf:
        - type: object
          additionalProperties: false
          required: [ok, subscription]
          properties:
            ok:
              type: boolean
              enum: [true]
            subscription:
              $ref: "#/components/schemas/Subscription"
        - type: object
          additionalProperties: false
          required: [ok, reason]
          properties:
            ok:
              type: boolean
              enum: [false]
            reason:
              $ref: "#/components/schemas/ScoreFailure"
